        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white transition-all transform translate-y-2 opacity-0 ${type === 'success' ? 'bg-slate-900 border border-slate-700' : 'bg-rose-600'}`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-4 h-4 text-blue-400"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function navigateTo(screen) {
            state.currentScreen = screen;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function scrollPanel(id, direction) {
            const el = document.getElementById(id);
            if (!el) return;
            el.scrollBy({ left: direction * 260, behavior: 'smooth' });
        }

        function openModal(type, data = null) {
            state.modalOpen = true;
            state.modalType = type;
            state.modalData = data;
            render();
        }

        function closeModal() {
            state.modalOpen = false;
            state.modalType = null;
            state.modalData = null;
            render();
        }

        function findTenderByGemId(value) {
            const query = String(value || '').trim().toUpperCase().replace(/\s+/g, '');
            if (!query) return null;
            return state.tenders.find(t => String(t.id).toUpperCase().replace(/\s+/g, '') === query) || null;
        }

        function findBidderByName(value) {
            const query = String(value || '').trim().toLowerCase();
            if (!query) return null;
            return state.bidders.find(b => String(b.name).toLowerCase().includes(query)) || null;
        }

        function searchWorkflowBidder(targetScreen = 'bidders') {
            const input = document.getElementById('workflowBidderSearch');
            const query = input ? input.value.trim() : state.workflowBidderSearch;
            state.workflowBidderSearch = query;

            const bidder = findBidderByName(query);
            if (!bidder) {
                showToast('No bidder found for this name. Try entering a bidder name.', 'error');
                return;
            }

            state.activeBidderId = bidder.id;
            state.workflowBidderSearch = bidder.name;
            navigateTo(targetScreen);
        }

        function searchWorkflowTender(targetScreen = 'tender_overview') {
            const input = document.getElementById('workflowGemSearch');
            const query = input ? input.value.trim() : state.workflowTenderSearch;
            state.workflowTenderSearch = query;

            const tender = findTenderByGemId(query);
            if (!tender) {
                showToast('No tender found for this GeM ID. Try an ID like GEM/2026/B/4819204.', 'error');
                return;
            }

            state.activeTenderId = tender.id;
            state.workflowTenderSearch = tender.id;

            if (targetScreen === 'bidders') {
                navigateTo('bidders');
            } else if (targetScreen === 'document_centre') {
                navigateTo('document_centre');
            } else if (targetScreen === 'requirements') {
                navigateTo('requirements');
            } else {
                navigateTo('tender_overview');
            }
        }

                                <span class="text-[10px] font-bold text-blue-600 tracking-wider uppercase block mb-1">Step 3</span>
                                <h3 class="font-bold text-slate-900 text-sm mb-2">Source Document</h3>
                                <p class="text-xs text-slate-600">Audited Balance Sheet FY24-25 & GSTR-3B Quarterly Returns.</p>
                            </div>
                            <button onclick="navigateTo('document_viewer')" class="w-full py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition">View PDF</button>
                        </div>

                        <!-- Step 4 -->
                        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between space-y-4">
                            <div>
                                <span class="text-[10px] font-bold text-blue-600 tracking-wider uppercase block mb-1">Step 4</span>
                                <h3 class="font-bold text-slate-900 text-sm mb-2">Extracted Evidence</h3>
                                <p class="text-xs text-slate-600">Page 12: "Total Revenue reported as ₹24,50,00,000 with 99.8% OCR confidence."</p>
                            </div>
                            <div class="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-[11px] text-emerald-800 font-medium">Confidence: 99.8%</div>
                        </div>

                        <!-- Step 5 -->
                        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between space-y-4">
                            <div>
                                <span class="text-[10px] font-bold text-emerald-600 tracking-wider uppercase block mb-1">Step 5</span>
                                <h3 class="font-bold text-slate-900 text-sm mb-2">Final Result</h3>
                                <p class="text-xs text-slate-600">Rule satisfied successfully. Validated against temporal submission window.</p>
                            </div>
                            <div class="p-2.5 rounded-xl bg-emerald-600 text-white text-[11px] font-bold text-center">PASSED & VERIFIED</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderOfficerReview() {
            return `
                
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-6 fade-in">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900 tracking-tight">Officer Review Queue</h2>
                            <p class="text-xs text-slate-500">Human-controlled verification queue for flagged compliance items and contradiction reviews.</p>
                        </div>
                        <button onclick="navigateTo('final_decision')" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded-xl transition shadow-sm">Proceed to Final Decision →</button>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-6">
                        <div class="p-4 rounded-xl bg-amber-50 border border-amber-200 flex items-start gap-4">
                            <div class="p-2.5 rounded-xl bg-amber-500 text-white mt-1"><i data-lucide="clock" class="w-5 h-5"></i></div>
                            <div class="space-y-3 flex-1">
                                <div class="flex items-center justify-between">
                                    <h3 class="font-bold text-amber-900 text-sm">Pending Review: Bidder B (Beta Systems & Networks Corp)</h3>
                                    <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-800">Requires Action</span>
                                </div>
                                <p class="text-xs text-amber-800">Turnover mismatch detected between GSTR-3B and Audited P&L. Officer must either accept, request clarification, or reject evidence.</p>
                                <div class="flex items-center gap-3 pt-2">
                                    <button onclick="showToast('Evidence marked as Reviewed & Accepted by Officer', 'success');" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg transition shadow-sm">Mark Reviewed & Accept</button>
                                    <button onclick="showToast('Clarification notice dispatched to Bidder B via GeM API', 'success');" class="px-3 py-1.5 bg-white hover:bg-slate-50 text-slate-900 text-xs font-semibold rounded-lg transition border border-slate-300">Request Clarification</button>
                                    <button onclick="showToast('Evidence rejected. Disqualification flag set.', 'error');" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold rounded-lg transition shadow-sm">Reject Evidence</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderFinalDecision() {
            return `
                
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-6 fade-in">
                    <!-- Banner -->
                    <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <div class="p-3 rounded-xl bg-blue-600 text-white"><i data-lucide="scale" class="w-6 h-6"></i></div>
                            <div>
                                <h2 class="text-lg font-bold">Final Procurement Officer Decision Panel</h2>
                                <p class="text-xs text-slate-300">"Final decision is made by the Procurement Officer. AI assists and recommends, but human authority is absolute."</p>
                            </div>
                    ${renderWorkflowBidderSearch()}
                        </div>
                        <span class="px-3 py-1 rounded-full bg-blue-500/20 border border-blue-400/40 text-blue-300 text-xs font-semibold">Jurisdiction: Central GeM 4.0</span>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-6">
                        <h3 class="font-bold text-slate-900 text-sm">Select Qualified Bidder & Authorize Award Recommendation</h3>
                        <div class="space-y-4">
                            ${state.bidders.map(b => `
                                <div class="flex items-center justify-between p-4 rounded-xl bg-slate-50 border border-slate-200/80 text-xs">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-xl bg-slate-900 text-white font-bold flex items-center justify-center">${b.name[0]}</div>
                                        <div>
                                            <div class="font-semibold text-slate-900 text-sm">${b.name}</div>
                                            <div class="text-slate-500">Score: ${b.score}/100 • Risk: ${b.risk} • Turnover: ${b.turnover}</div>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <button onclick="showToast('${b.name} officially QUALIFIED for contract award', 'success');" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl transition shadow-sm">Qualify Bidder</button>
                                        <button onclick="showToast('${b.name} officially DISQUALIFIED with officer notes', 'error');" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-xl transition shadow-sm">Disqualify</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAuditTrail() {
            return `
                
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-6 fade-in">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900 tracking-tight">Immutable Audit Trail & Event Log</h2>
                            <p class="text-xs text-slate-500">Cryptographically signed chronological log of all system and officer actions.</p>
                        </div>
                    ${renderWorkflowBidderSearch()}
                        <button onclick="showToast('Audit trail exported as secure signed JSON bundle', 'success');" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded-xl transition shadow-sm flex items-center gap-2">
                            <i data-lucide="download" class="w-3.5 h-3.5"></i> Export Audit Log
                        </button>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
                        <div class="space-y-4">
                            ${state.auditTrail.map(a => `
                                <div class="flex items-start gap-4 pb-4 border-b border-slate-100 last:border-0 last:pb-0 text-xs">
                                    <span class="font-mono text-slate-400 font-medium whitespace-nowrap">${a.time}</span>
                                    <div class="flex-1">
                                        <div class="font-semibold text-slate-900">${a.event}</div>
                                        <div class="text-slate-500 mt-0.5">Actor: ${a.actor} • Type: <span class="uppercase font-bold text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-700">${a.type}</span></div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderReports() {
            return `
                
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-6 fade-in">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900 tracking-tight">Reports & Compliance Export Centre</h2>
                            <p class="text-xs text-slate-500">Generate executive summary reports, audit dossiers, and CSV compliance matrices.</p>
                        </div>
                        <button onclick="showToast('Comprehensive report bundle generated successfully', 'success');" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded-xl transition shadow-sm flex items-center gap-2">
                            <i data-lucide="download" class="w-3.5 h-3.5"></i> Download PDF Report
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                            <div class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center"><i data-lucide="file-text" class="w-5 h-5"></i></div>
                            <h3 class="font-bold text-slate-900 text-sm">Executive Compliance Dossier</h3>
                            <p class="text-xs text-slate-500">Complete multi-bidder comparison, extracted evidence chains, and temporal validity logs.</p>
                            <button onclick="showToast('Executive PDF downloaded', 'success');" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-900 font-semibold text-xs rounded-xl transition">Export PDF</button>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                            <div class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center"><i data-lucide="table" class="w-5 h-5"></i></div>
                            <h3 class="font-bold text-slate-900 text-sm">CSV Matrix Export</h3>
                            <p class="text-xs text-slate-500">Raw requirement evaluation matrix for statistical analysis and central audit archives.</p>
                            <button onclick="showToast('Compliance CSV downloaded', 'success');" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-900 font-semibold text-xs rounded-xl transition">Export CSV</button>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                            <div class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center"><i data-lucide="shield-check" class="w-5 h-5"></i></div>
                            <h3 class="font-bold text-slate-900 text-sm">Signed Audit Bundle</h3>
                            <p class="text-xs text-slate-500">Cryptographically hashed event log bundle conforming to IT Act standards.</p>
                            <button onclick="showToast('Signed Audit Bundle downloaded', 'success');" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-900 font-semibold text-xs rounded-xl transition">Export Signed ZIP</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderConnectors() {
            return `
                
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-6 fade-in">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900 tracking-tight">Simulated Government Connectors & APIs</h2>
                            <p class="text-xs text-slate-500">Real-time status of integrated government registry endpoints and secure vaults.</p>
                        </div>
                        <span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-semibold flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> All Systems Operational
                        </span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${state.connectors.map(c => `
                            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                                <div class="flex items-center justify-between">
                                    <div class="p-2 rounded-xl bg-slate-100 text-slate-900"><i data-lucide="${c.icon}" class="w-4 h-4"></i></div>
                                    <span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 text-[10px] font-semibold border border-emerald-200">${c.status}</span>
                                </div>
                                <h3 class="font-bold text-slate-900 text-sm">${c.name}</h3>
                                <div class="flex justify-between text-[11px] text-slate-500 pt-2 border-t border-slate-100">
                                    <span>Latency: ${c.latency}</span>
                                    <span>Last Sync: ${c.lastSync}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            if (!state.isAuthenticated) {
                app.innerHTML = renderLogin();
            } else {
                let content = '';
                switch(state.currentScreen) {
                    case 'dashboard': content = renderDashboard(); break;
                    case 'tenders': content = renderTenders(); break;
                    case 'tender_overview': content = renderTenderOverview(); break;
                    case 'upload_tender': content = renderUploadTender(); break;
                    case 'requirements': content = renderRequirements(); break;
                    case 'bidders': content = renderBidders(); break;
                    case 'bidder_overview': content = renderBidderOverview(); break;
                    case 'document_centre': content = renderDocumentCentre(); break;
                    case 'document_viewer': content = renderDocumentViewer(); break;
                    case 'extraction': content = renderExtraction(); break;
                    case 'compliance_results': content = renderComplianceResults(); break;
                    case 'compliance_dashboard': content = renderComplianceDashboard(); break;
                    case 'contradiction_radar': content = renderContradictionRadar(); break;
                    case 'temporal': content = renderTemporalCompliance(); break;
                    case 'prove_it': content = renderProveIt(); break;
                    case 'officer_review': content = renderOfficerReview(); break;
                    case 'final_decision': content = renderFinalDecision(); break;
                    case 'audit_trail': content = renderAuditTrail(); break;
                    case 'profile_details': content = renderProfileDetails(); break;
                    case 'profile_settings': content = renderProfileSettings(); break;
                    case 'profile_security': content = renderSecuritySettings(); break;
                    case 'reports': content = renderReports(); break;
                    case 'connectors': content = renderConnectors(); break;
                    default: content = renderDashboard();
                }

                app.innerHTML = `
                    ${renderHeader()}
                    <main class="flex-1 flex flex-col">${content}</main>
                    <footer class="bg-white border-t border-slate-200 py-4 px-6 text-center text-xs text-slate-500">
                        VERITAS Evidence Intelligence Engine & Temporal Compliance for GeM • Secure Government Portal v4.2
                    </footer>
                `;
            }
            lucide.createIcons();
        }

        // Initialize on load
        window.onload = function() {
            render();
        }
    </script>
</body>
</html>
